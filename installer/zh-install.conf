# Indstillinger for install-linux.sh og install-windows.ps1 / install-windows.bat.
# Format: NØGLE=værdi. Linjer der starter med # ignoreres.
# Miljøvariabler (Linux) og parametre (Windows) går forud for værdierne her.
#
# VIGTIGT: Alle spillere i et LAN-spil skal køre samme build (samme REPO og TAG).

# GitHub-repo som buildet hentes fra.
#   Tricky12321/CnC_Generals_Zero_Hour  = resync-forken
#   TheSuperHackers/GeneralsGameCode    = officiel build
REPO=Tricky12321/CnC_Generals_Zero_Hour

# Release-tag der installeres.
#   latest                         = nyeste release i REPO (standard)
#   historical-2026-10-10-18449d8  = fase 1 (5 mismatches i træk før desync)
#   historical-2026-10-10-01903bb  = fase 2 (resync via flertal, kun til test)
#   historical-2026-10-10-acb2ba3  = fase 3 (resync med indlæsning/genafspilning, checkpoints, /resume, mismatch-rapporter; utestet)
#   weekly-2026-10-02              = officiel build (kræver REPO=TheSuperHackers/GeneralsGameCode)
TAG=latest

# Zero Hour-mappe. Tom = find automatisk.
INSTALL_DIR=

# 1 = medtag debug-symboler (.pdb).
INCLUDE_PDB=0

# 1 = spring installation af GenLauncher over.
SKIP_GENLAUNCHER=0
